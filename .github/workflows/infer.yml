name: infer
on:
  workflow_dispatch:
    inputs:
      prompt:
        required: true
      request_id:
        required: true
permissions:
  contents: read
  issues: write
jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache model
        uses: actions/cache@v4
        with:
          path: models
          key: qwen05b-q4km-v1

      - name: Download llama.cpp binary
        run: |
          curl -L -o llama-bin.zip \
            https://github.com/ggml-org/llama.cpp/releases/download/b7075/llama-b7075-bin-ubuntu-x64.zip
          unzip -q llama-bin.zip -d llama
          chmod +x llama/build/bin/llama-cli
          ldd llama/build/bin/llama-cli | grep "not found" && exit 1 || true
          llama/build/bin/llama-cli --version

      - name: Download model
        run: |
          mkdir -p models
          test -f models/qwen2.5-0.5b-instruct-q4_k_m.gguf || \
            curl -L -o models/qwen2.5-0.5b-instruct-q4_k_m.gguf \
            https://hf-mirror.com/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf

      - name: Run inference
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PROMPT: ${{ inputs.prompt }}
          REQUEST_ID: ${{ inputs.request_id }}
          ISSUE_NUMBER: "1"
        run: python scripts/infer.py
